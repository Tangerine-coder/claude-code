# Render Blueprint
#
# 数据默认存在 Turso（libSQL）云端库，所以**免费实例也能持久化**，
# 不再依赖 Render 的持久磁盘。
#
# 使用前在 Render 控制台填好下面两个 sync: false 的变量：
#   TURSO_DATABASE_URL = libsql://<你的库名>-<org>.turso.io
#   TURSO_AUTH_TOKEN   = turso db tokens create <库名>
services:
  - type: web
    name: nova-mart
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # 自动生成随机密钥，避免使用仓库里的默认值
      - key: JWT_SECRET
        generateValue: true
      # 管理员初始密码，首次部署后请在后台「账户安全」改掉
      - key: ADMIN_PASSWORD
        sync: false
      # Turso 云端数据库（不填则退回本地 SQLite 文件）
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
